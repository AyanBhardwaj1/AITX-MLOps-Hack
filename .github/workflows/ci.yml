name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, eval, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Detector eval (fails below 95% precision or recall)
        run: npm run eval
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  database:
    name: Schema and Postgres store tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schema tests (RLS, tenant isolation, drafts-only trigger)
        run: npm run test:db
      - name: Postgres store contract tests
        run: npm run test:integration

  e2e:
    name: Browser end-to-end (accounts, teams, uploads)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        # The download or apt step sometimes stalls with no error; give each try two minutes.
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            timeout -k 10 120 npx playwright install --with-deps chromium && exit 0
            echo "Chromium install attempt $attempt stalled or failed; trying again"
          done
          exit 1
      - name: Sign-in, isolation, settings, teams and uploads in a real browser
        run: npm run test:e2e
